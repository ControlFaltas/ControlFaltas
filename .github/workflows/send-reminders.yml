name: Enviar recordatorios de agenda

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      # CAMBIA ESTA URL por la URL real de tu PWA.
      APP_URL: 'controlfaltas.es'
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         

      - name: Instalar dependencias
        run: npm install

      - name: Enviar recordatorios
        run: npm run send-reminders
